name: Fleet regression checks
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build backend
        run: dotnet build backend/src/MontraFleet.Api/MontraFleet.Api.csproj -c Release
      - name: Run lifecycle, inventory, release, report and picture checks
        run: dotnet run --project tests/LifecycleChecks/LifecycleChecks.csproj -c Release
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --package-lock=false
      - name: Build Angular
        working-directory: frontend
        env:
          NG_CLI_ANALYTICS: 'false'
        run: npm run build
