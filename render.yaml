services:
  - type: web
    name: montra-fleet-app
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile.render
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AUTO_CREATE_DB
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: montra-fleet-db
          property: connectionString

databases:
  - name: montra-fleet-db
    plan: free
    region: singapore
    postgresMajorVersion: "18"
    databaseName: montra_fleet
    user: montra_fleet_user
